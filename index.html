function render(){document.documentElement.dataset.theme=S.theme;if(!S.ob)return onboard();if(!S.sched.length)genSched();
const n=$("#nav");n.hidden=false;n.innerHTML=[["home","🏠","Home"],["explore","🧭","Explore"],["challenges","🎯","Challenge"],["progress","📈","Progress"],["profile","👤","Profile"]].map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')" aria-label="${t[2]}"><i>${t[1]}</i>${t[2]}</button>`).join("");

render();
