function delAll(){confirmSheet("Delete all my data?","This removes your profile, progress and custom role models from this device. It can't be undone.","Delete everything",()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()})}
function resetProg(){confirmSheet("Reset progress?","Your XP, streak, badges and history will go back to zero. Your profile stays.","Reset",()=>{Object.assign(S,{done:{},log:[],pts:0,streak:0,best:0,last:"",badges:[],gx:{}});save();close();toast("Progress reset");render()})}
function editBday(){const[y,m,d]=(S.bday||(new Date().getFullYear()-14)+"-01-01").split("-").map(Number);sheet(`<h2 style="margin-top:0">Your birthday</h2><div class=whs>${wheel("wm",MON,"Month")}${wheel("wd",DAYS,"Day")}${wheel("wy",YRS,"Year")}</div><p id=ag style="font-weight:700"></p><div class=row><button class=grow id=bs>Save</button><button class=ghost id=bc>Cancel</button></div>`);initWheels(m-1,d-1,y);$("#bc").onclick=close;$("#bs").onclick=()=>{const r=rw(),dt=new Date(r.y,r.m-1,r.d),a=ageOf(r.y+"-"+r.m+"-"+r.d);if(dt.getMonth()!=r.m-1||dt>new Date()||a<5||a>100)return toast("Please check the date.",1);S.bday=r.y+"-"+String(r.m).padStart(2,"0")+"-"+String(r.d).padStart(2,"0");S.years=a;S.age=a<13?0:a<18?1:2;genSched();close();toast("Saved");render()}}
function tour(i){const x=TOUR[i],last=i==TOUR.length-1;let o=$("#tr");if(!o){o=document.createElement("div");o.id="tr";o.className="tr";document.body.append(o)}
o.innerHTML=`<div class=tc role=dialog aria-label="App tour"><div class=tic>${i==0?mas(90):x[0]}</div><h2 style="margin:0 0 8px">${x[1]}</h2><p>${x[2]}</p><div class=dots>${TOUR.map((_,j)=>`<i class="${j==i?"on":""}"></i>`).join("")}</div><div class=row>${i?`<button class=ghost onclick="tour(${i-1})">Back</button>`:`<button class=ghost onclick="endTour()">Skip</button>`}<button class=grow onclick="${last?"endTour()":`tour(${i+1})`}">${last?"Got it!":"Next"}</button></div></div>`}
function endTour(){S.tour=1;save();const o=$("#tr");if(o)o.remove()}
function xpPop(n){const e=document.createElement("div");e.className="xpp";e.textContent="+"+n+" XP";document.body.append(e);setTimeout(()=>e.remove(),1300)}
function theme(t){S.theme=t;save();document.documentElement.dataset.theme=t;render()}
function go(t){tab=t;render();scrollTo(0,0)}
function onboard(){const st=S.step,a=$("#app");$("#nav").hidden=true;
const chips=(k,max)=>`<div class=wrap style="margin:12px 0">${[...SK,...S.cust].map(x=>`<button class="chip ${S[k].includes(x)?"on":""}" onclick="pick('${k}','${x}',${max})">${x}</button>`).join("")}</div><div class=row><input id=ot maxlength=24 placeholder="Other: type your own quality" aria-label="Other quality"><button class=ghost onclick="addOther('${k}',${max})">Add</button></div>`;
const[bY,bM,bD]=(S.bday||(new Date().getFullYear()-14)+"-01-01").split("-").map(Number);
const list=[...S.mix.map(rm).filter(Boolean),...recs()].filter((m,i,a)=>a.findIndex(x=>x.id==m.id)==i).slice(0,6);
const steps=[`<h1>Become inspired. Become better.</h1><p>Let's get to know you, so we can build a plan that fits your life.</p><input id=ob1 maxlength=24 placeholder="What should we call you?" value="${esc(S.name)}"><h3>Your birthday</h3><div class=whs>${wheel("wm",MON,"Month")}${wheel("wd",DAYS,"Day")}${wheel("wy",YRS,"Year")}</div><p id=ag style="font-weight:700;margin:6px 0"></p><p style="font-size:13px">Scroll each wheel. We only use this to work out your age and shape your plan.</p>`,
`<h1>What are you good at?</h1><p>Pick up to 3 strengths.</p>${chips("str",3)}`,
`<h1>What do you want to grow?</h1><p>Pick up to 3. Everyone is working on something.</p>${chips("weak",3)}`,
`<h1>How busy are your days?</h1>${[["Light","About 30 free minutes most days"],["Medium","About 20 minutes"],["Packed","About 10 minutes, short tasks"]].map((x,i)=>`<div class=card style="cursor:pointer;${S.busy==i?"border-color:var(--ac)":""}" onclick="S.busy=${i};render()"><b>${x[0]}</b><p style="margin:2px 0 0">${x[1]}</p></div>`).join("")}`,
`<h1>Make it yours</h1><h3>Challenges per area</h3><div class=wrap style="margin:10px 0">${[1,2,3,4,5].map(n=>`<button class="chip ${S.n==n?"on":""}" onclick="S.n=${n};render()">${n}</button>`).join("")}</div><h3>New challenges</h3><div class=wrap style="margin:10px 0"><button class="chip ${S.mode=="day"?"on":""}" onclick="S.mode='day';render()">Every day</button><button class="chip ${S.mode=="month"?"on":""}" onclick="S.mode='month';render()">Every month</button></div>`,
`<h1>Your role model mix</h1><p>Chosen for what you want to grow. Pick up to 3 and we'll blend their skills.</p><div class=grid>${list.map(m=>`<div class="card rm" style="${S.mix.includes(m.id)?"border-color:var(--ac)":""}" onclick="mixToggle('${m.id}');render()">${av(m,64)}<b>${esc(m.name)}</b><small>${m.q.join(" · ")}</small></div>`).join("")}</div>`,
`<h1>Your growth starts today.</h1><p>Here's a week built around your goals and time.</p>${weekHTML()}`];
a_=steps[st];$("#app").innerHTML=`<div style="padding-top:6vh"><div class=bar style="margin-bottom:24px"><div style="width:${(st+1)/7*100}%"></div></div>${a_}<br><button style="width:100%" id=nx>${st==0?"Get Started":st==6?"Let's Begin":"Next"}</button>${st==0?'<button class=ghost style="width:100%;margin-top:12px" onclick="skipAll()">Skip the quiz</button>':st==5?'<button class=ghost style="width:100%;margin-top:12px" onclick="skipRM()">Skip role models</button>':""}</div>`;
if(st==0)initWheels(bM-1,bD-1,bY);
$("#nx").onclick=()=>{if(st==0){S.name=$("#ob1").value.trim();if(!S.name)return toast("Please enter a name.",1);const r=rw(),dt=new Date(r.y,r.m-1,r.d);if(dt.getMonth()!=r.m-1)return toast("That date doesn't exist.",1);if(dt>new Date())return toast("Birthday can't be in the future.",1);const b=r.y+"-"+String(r.m).padStart(2,"0")+"-"+String(r.d).padStart(2,"0"),y=ageOf(b);if(y<5||y>100)return toast("Please check your birthday.",1);S.bday=b;S.years=y;S.age=y<13?0:y<18?1:2}
if(st==2&&!S.weak.length)return toast("Pick at least one to work on.",1);if(st==4)S.mix=mixFor();if(st==5){if(!S.mix.length)return toast("Pick at least one role model.",1);genSched()}
if(st==6){S.ob=1;S.step=0}else S.step++;save();render()}}
function render(){document.documentElement.dataset.theme=S.theme;if(!S.ob)return onboard();if(!S.sched.length)genSched();
const n=$("#nav");n.hidden=false;n.innerHTML=[["home","🏠",t("home")],["explore","🧭",t("explore")],["challenges","🎯",t("challenge")],["play","🎮",t("play")],["progress","📈",t("progress")],["profile","👤",t("profile")]].map(t=>`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')" aria-label="${t[2]}"><i>${t[1]}</i>${t[2]}</button>`).join("");
$("#app").innerHTML=hud()+V[tab]();document.documentElement.classList.toggle("calm",!!S.calm);document.querySelectorAll("#app .grid>.card,#app>.card,#app .pn,#app .tile").forEach((e,i)=>e.style.animationDelay=i*60+"ms");document.querySelectorAll("[data-n]").forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(now){const k=Math.min(1,(now-t0)/800);e.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f)})(t0)});if(!S.tour&&!$("#tr")&&!window._tw){window._tw=1;setTimeout(()=>tour(0),500)};
const sq=$("#sq");if(sq)sq.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const x=$("#sq");x.focus();x.setSelectionRange(p,p)};
const nm=$("#nm");if(nm)nm.onchange=e=>{S.name=e.target.value.trim()||S.name;save();toast("Name saved")}}
["⭐","🔥","📚","🎯","💪","🌟","🧠","🚀"].forEach((e,i)=>{const x=document.createElement("span");x.className="fx";x.textContent=e;x.style.left=(6+i*12)+"%";x.style.animationDelay=-i*1.8+"s";document.body.append(x)});
render();
</script></body></html>
